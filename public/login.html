<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Entrar — peopleX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #fff8f8; }
    .mono { font-family: 'DM Mono', monospace; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);} }
    .fade-up { animation: fadeUp 0.45s ease both; }
    .d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}
    input:focus { outline: none; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-32 -right-32 w-80 h-80 bg-red-100 rounded-full opacity-70"></div>
    <div class="absolute -bottom-32 -left-32 w-80 h-80 bg-rose-100 rounded-full opacity-70"></div>
  </div>

  <div class="relative w-full max-w-md">
    <div class="text-center mb-8 fade-up">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-red-700 rounded-2xl mb-4 shadow-lg shadow-red-200">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857
               M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857
               m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-slate-800">peopleX</h1>
      <p class="text-slate-500 text-sm mt-1">Comunicação e gestão de pessoas</p>
    </div>

    <div class="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-8 fade-up d1">
      <h2 class="text-base font-semibold text-slate-800 mb-6">Entrar na sua conta</h2>

      <div id="erro" class="hidden mb-5 px-4 py-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl"></div>

      <div class="mb-4 fade-up d1">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Identificador da empresa</label>
        <div class="relative">
          <span class="mono absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">empresa/</span>
          <input id="slug" type="text" placeholder="nome-da-empresa"
            class="mono w-full pl-[88px] pr-4 py-3 border border-slate-200 rounded-xl text-sm
                   text-slate-800 bg-slate-50 focus:bg-white focus:border-red-400 transition-colors"/>
        </div>
      </div>

      <div class="mb-4 fade-up d2">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">E-mail</label>
        <input id="email" type="email" placeholder="seu@example.invalid"
          class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm
                 text-slate-800 bg-slate-50 focus:bg-white focus:border-red-400 transition-colors"/>
      </div>

      <div class="mb-6 fade-up d3">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Senha</label>
        <div class="relative">
          <input id="senha" type="password" placeholder="••••••••"
            class="w-full pl-4 pr-11 py-3 border border-slate-200 rounded-xl text-sm
                   text-slate-800 bg-slate-50 focus:bg-white focus:border-red-400 transition-colors"/>
          <button type="button" onclick="toggleSenha()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.477
                   0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477
                   0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <button type="button" onclick="esqueciSenha()"
          class="text-xs text-red-700 hover:text-red-800 font-medium mt-2">
          Esqueci minha senha
        </button>
      </div>

      <button id="btn-login" onclick="fazerLogin()"
        class="w-full py-3 bg-red-700 hover:bg-red-800 active:scale-[.98]
               text-white text-sm font-medium rounded-xl transition-all fade-up d4">
        Entrar
      </button>

      <div class="flex items-center gap-3 my-5">
        <span class="h-px bg-slate-200 flex-1"></span>
        <span class="text-[11px] text-slate-400 uppercase tracking-wider">ou</span>
        <span class="h-px bg-slate-200 flex-1"></span>
      </div>

      <button onclick="explorarDemo()"
        class="w-full py-3 bg-rose-50 hover:bg-rose-100 border border-rose-200
               text-rose-900 text-sm font-medium rounded-xl transition-all">
        Explorar ambiente de demonstração
      </button>
      <p class="text-center text-[11px] text-slate-400 mt-3">Sem cadastro ou banco de dados</p>
    </div>
    <p class="text-center text-xs text-slate-400 mt-6">peopleX &copy; 2026</p>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    if (estaLogado()) window.location.href = '/dashboard.html';
    document.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

    const ERRO_CLASS = 'mb-5 px-4 py-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl';
    const SUCESSO_CLASS = 'mb-5 px-4 py-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm rounded-xl';
    function mostrarMensagem(texto, sucesso = false) {
      const erro = document.getElementById('erro');
      erro.className = sucesso ? SUCESSO_CLASS : ERRO_CLASS;
      erro.textContent = texto;
    }

    function toggleSenha() {
      const i = document.getElementById('senha');
      i.type = i.type === 'password' ? 'text' : 'password';
    }

    async function fazerLogin() {
      const slug  = document.getElementById('slug').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      document.getElementById('erro').classList.add('hidden');

      if (!slug || !email || !senha) return mostrarMensagem('Preencha todos os campos.');

      const btn = document.getElementById('btn-login');
      btn.textContent = 'Entrando…';
      btn.disabled = true;

      try {
        const res  = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, email, password: senha }),
        });
        const data = await res.json();

        if (!res.ok) return mostrarMensagem(data.error || 'Credenciais inválidas.');

        salvarSessao({ ...data, email: data.email || email });
        window.location.href = '/dashboard.html';
      } catch {
        mostrarMensagem('Servidor indisponível.');
      } finally {
        btn.textContent = 'Entrar';
        btn.disabled = false;
      }
    }

    async function esqueciSenha() {
      const slug  = document.getElementById('slug').value.trim();
      const email = document.getElementById('email').value.trim();
      document.getElementById('erro').classList.add('hidden');

      if (!slug || !email)
        return mostrarMensagem('Preencha empresa e e-mail acima, depois clique em "Esqueci minha senha".');

      try {
        await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, email }),
        });
      } catch {}

      mostrarMensagem('Se existir uma conta com esse e-mail, enviamos um link de redefinição de senha.', true);
    }

    function explorarDemo() {
      localStorage.setItem('hr_demo', 'true');
      salvarSessao({ token: 'demo-token', refreshToken: 'demo-refresh', name: 'Pessoa Demo 01', isOwner: true, email: 'pessoa01@example.invalid' });
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
